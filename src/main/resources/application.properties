spring.application.name=ecommerce

# Profile used when none is specified. Production: SPRING_PROFILES_ACTIVE=prod (or any other) plus JWT_SECRET.
spring.profiles.default=local

spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=2000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# OpenAPI / Swagger UI are disabled by default; enabled in the local profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# Demo users and sample data: off unless a profile enables it
app.seed.enabled=false

# JWT (HS256). Secret (min 32 chars) and expiration (e.g. 15m, 1h) are mandatory and have no default here.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION}

# Application logging (override per profile or with LOGGING_LEVEL_IT_EXAMPLE_ECOMMERCE)
logging.level.it.example.ecommerce=INFO
