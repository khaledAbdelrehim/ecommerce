# Local development profile (active by default). Do not use in production.

# H2 console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Demo users and sample data
app.seed.enabled=true

# Development-only JWT secret, still overridable via JWT_SECRET
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

# Token lifetime (Duration format, e.g. 15m, 1h), overridable via JWT_EXPIRATION
app.security.jwt.expiration=${JWT_EXPIRATION:15m}

# More verbose application logging in development
logging.level.it.example.ecommerce=DEBUG
